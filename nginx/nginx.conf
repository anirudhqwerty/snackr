events {}

http {
  server {
    listen 80;

    # Removed trailing slash to match /auth and /auth/ routes
    location /auth {
      proxy_pass http://auth-service:5000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Removed trailing slash to match /food and /food/ routes
    location /food {
      proxy_pass http://food-service:5001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }

    # Removed trailing slash to match /orders and /orders/ routes
    location /orders {
      proxy_pass http://order-service:5002;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }
  }
}
